<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body { font-family: Arial, sans-serif; background:linear-gradient(#bfe3f5,#eaf6fb); min-height:100vh; margin:0; display:flex; justify-content:center; padding:40px 16px; }
.box { background:#fff; width:100%; max-width:400px; padding:24px; border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.15); align-self:flex-start; }
.row { display:flex; gap:8px; }
input { flex:1; padding:10px; font-size:1rem; border:1px solid #8aa; border-radius:4px; }
button { padding:10px 16px; border:0; background:#0369a1; color:#fff; border-radius:4px; font-size:1rem; cursor:pointer; }
#result { margin-top:20px; text-align:center; }
.temp { font-size:3rem; margin:6px 0; }
.details { display:flex; justify-content:space-around; margin-top:14px; color:#456; }
.error { color:#b91c1c; }
</style>
</head>
<body>
<main class="box card card-body">
  <h1>Weather</h1>
  <div class="row">
    <input id="city" type="text" class="form-control" placeholder="Enter a city, e.g. Noida" aria-label="City name">
    <button id="go" class="btn btn-primary">Get weather</button>
  </div>
  <div id="result" aria-live="polite"></div>
</main>
<script>
// Open-Meteo: free, no API key. Step 1 geocoding, step 2 current weather.
const codes = {0:'Clear sky',1:'Mainly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Light drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',71:'Light snow',73:'Snow',75:'Heavy snow',80:'Rain showers',81:'Rain showers',82:'Violent showers',95:'Thunderstorm',96:'Thunderstorm with hail',99:'Thunderstorm with hail'};
const result = document.getElementById('result');
const cityInput = document.getElementById('city');

async function getWeather() {
  const city = cityInput.value.trim();
  if (!city) { result.innerHTML = '<p class="alert alert-danger">Please enter a city name.</p>'; return; }
  result.textContent = 'Loading...';
  try {
    const geoRes = await fetch('https://geocoding-api.open-meteo.com/v1/search?count=1&name=' + encodeURIComponent(city));
    const geo = await geoRes.json();
    if (!geo.results) { result.innerHTML = '<p class="alert alert-danger">City not found. Check the spelling and try again.</p>'; return; }
    const p = geo.results[0];
    const url = 'https://api.open-meteo.com/v1/forecast?latitude=' + p.latitude + '&longitude=' + p.longitude +
                '&current=temperature_2m,relative_humidity_2m,wind_speed_10m,weather_code';
    const w = (await (await fetch(url)).json()).current;
    result.innerHTML =
      '<h2>' + p.name + ', ' + (p.country || '') + '</h2>' +
      '<div class="temp">' + Math.round(w.temperature_2m) + '&deg;C</div>' +
      '<p>' + (codes[w.weather_code] || 'Unknown conditions') + '</p>' +
      '<div class="details"><span>Humidity: ' + w.relative_humidity_2m + '%</span><span>Wind: ' + w.wind_speed_10m + ' km/h</span></div>';
  } catch (err) {
    result.innerHTML = '<p class="alert alert-danger">Could not load weather. Check your internet connection.</p>';
  }
}
document.getElementById('go').addEventListener('click', getWeather);
cityInput.addEventListener('keydown', e => { if (e.key === 'Enter') getWeather(); });
</script>
</body>
</html>
